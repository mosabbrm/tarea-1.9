<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
    <!-- form: sirve para crear un formulario interactivo para que el 
     usuario envíe datos; action: indica la dirección web o archivo a 
     donde se envían los datos del formulario; method: especifica el 
     método HTTP con el que se envían los datos (en este caso, get) -->
        <form action="index.html" method="get">
            <!-- fieldset: sirve para agrupar elementos relacionados dentro de un formulario; 
            legend: sirve para poner un título o leyenda descriptiva al grupo del fieldset -->
            <fieldset>
                <legend>Datos personales by Mosab</legend>
                <!-- label: etiqueta un campo; for: la vincula al id del input -->
                <label for="nombre">Nombre:</label>
                <!-- type="text": texto simple; placeholder: texto de ayuda; required:
                  obligatorio; autofocus: enfoca al cargar; size: ancho visible; maxlength: límite de letras -->
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" 
                required autofocus size="30" maxlength="40">
                <br><br>

                <label for="pass">Contraseña:</label>
                <!-- type="password": oculta el texto; minlength: mínimo de caracteres -->
                <input type="password" id="pass" name="password" minlength="8">
                <br><br>

                <label for="correo">Correo electrónico:</label>
                <!-- type="email": valida formato de e-mail -->
                <input type="email" id="correo" name="email" required>
                <br><br>

                <label for="tel">Teléfono:</label>
                <!-- type="tel": campo telefónico; pattern: formato exigido (9 números) -->
                <input type="tel" id="tel" name="telefono" pattern="[0-9]{9}">
                <br><br>
                <label for="fecha">Fecha de nacimiento:</label>
                <!-- type="date": abre un selector de calendario para elegir una fecha -->
                <input type="date" id="fecha" name="nacimiento">
                <br><br>

                <label for="foto">Foto de perfil:</label>
                <!-- type="file": permite al usuario seleccionar y subir un archivo desde 
                 su equipo -->
                <input type="file" id="foto" name="archivo">
                <br><br>

                <label for="curso">Curso:</label>
                <!-- value="2026-27": establece un valor predeterminado en el campo; 
                readonly: hace que el campo sea de solo lectura (el usuario no puede modificarlo) -->
                <input type="text" id="curso" name="curso" value="2026-27" readonly>
                <br><br>

                <label for="centro">Centro educativo:</label>
                <!-- disabled: desactiva el campo por completo (no se puede editar ni se envía
                  en el formulario) -->
                <input type="text" id="centro" name="centro" value="IES La Asunción" disabled>
            </fieldset>
            <fieldset>
            <legend>Preferencias</legend>

            <!-- type="radio": opción de selección única dentro de un grupo con el mismo name; value: valor enviado al servidor -->
            <label>Turno:</label><br>
            <input type="radio" id="mañana" name="turno" value="manana">
            <!-- label en las opciones de selección para asociar el texto con su id -->
            <label for="mañana">Mañana</label>

            <input type="radio" id="tarde" name="turno" value="tarde">
            <label for="tarde">Tarde</label>
            <br><br>

            <!-- type="checkbox": casilla de verificación de selección múltiple con el mismo name -->
            <label>Intereses:</label><br>
            <input type="checkbox" id="web" name="intereses" value="web">
            <label for="web">Desarrollo Web</label>

            <input type="checkbox" id="sistemas" name="intereses" value="sistemas">
            <label for="sistemas">Sistemas</label>

            <input type="checkbox" id="bd" name="intereses" value="bd">
            <label for="bd">Bases de Datos</label>
            <br><br>
            <label for="horas">Horas de estudio diarias:</label>
            <!-- type="number": selector numérico; min/max: rango permitido; step: incremento entre valores -->
            <input type="number" id="horas" name="horas" min="0" max="10" step="2">
            <br><br>

            <label for="nivel">Nivel de experiencia (1 a 10):</label>
            <!-- type="range": deslizador de rango numérico -->
            <input type="range" id="nivel" name="nivel" min="1" max="10">
            <br><br>

            <label for="color">Color favorito:</label>
            <!-- type="color": abre un selector de color en formato hexadecimal -->
            <input type="color" id="color" name="color">
            <br><br>

            <label for="hora">Hora preferida de contacto:</label>
            <!-- type="time": selector de hora del día -->
            <input type="time" id="hora" name="hora">
            <br><br>

            <label for="semana">Semana preferida:</label>
            <!-- type="week": selector de semana y año -->
            <input type="week" id="semana" name="semana">
            <br><br>

            <label for="mes">Mes de incorporación:</label>
            <!-- type="month": selector de mes y año -->
            <input type="month" id="mes" name="mes">
            <br><br>
            <label for="modulos">Módulos matriculados:</label><br>
            <!-- select: despliega una lista de opciones; multiple: permite seleccionar más de una opción -->
            <select id="modulos" name="modulos" multiple>
                <!-- optgroup: agrupa opciones con un título descriptivo (label) -->
                <optgroup label="Primer curso">
                    <!-- option: representa cada opción disponible; selected: marca esta opción seleccionada por defecto -->
                    <option value="lm" selected>Lenguajes de marcas</option>
                    <option value="prog">Programación</option>
                    <option value="bd">Bases de datos</option>
                </optgroup>
                <optgroup label="Otros">
                    <option value="ipe">IPE</option>
                    <option value="ing">Inglés</option>
                </optgroup>
            </select>
            <br><br>

            <label for="comentarios">Comentarios:</label><br>
            <!-- textarea: área de texto multilínea; rows: filas visibles; cols: columnas o ancho visible -->
            <textarea id="comentarios" name="comentarios" rows="4" cols="50" placeholder="Escribe aquí tus observaciones..."></textarea>
        </fieldset>
        <!-- input type="submit": botón para enviar el formulario; 
        input type="reset": botón para limpiar todos los campos del formulario; 
        input type="button": botón genérico interactivo sin acción predefinida -->
        <input type="submit" value="Enviar (input)">
        <input type="reset" value="Limpiar (input)">
        <input type="button" value="Botón genérico (input)">
        <br><br>

        <!-- input type="image": botón de envío con aspecto de imagen; 
        src: ruta de la imagen; alt: texto alternativo si la imagen no carga -->
        <input type="image" src="https://via.placeholder.com/100x30" alt="Enviar imagen">
        <br><br>

        <!-- button type="submit": botón avanzado de envío; 
        button type="reset": botón avanzado de limpieza; 
        button type="button": botón avanzado genérico -->
        <button type="submit">Enviar (button)</button>
        <button type="reset">Limpiar (button)</button>
        <button type="button">Genérico (button)</button>
    </form>
<!-- form para conectar con el buscador externo de la Wikipedia -->
        <form action="https://es.wikipedia.org/w/index.php" method="get">
            <br><hr><br>
            <!-- type="search": campo optimizado para búsquedas; 
            list: asocia el input con un elemento datalist mediante su id -->
            <label for="busqueda-wiki">Buscar en Wikipedia:</label>
            <input type="search" id="busqueda-wiki" name="search" list="sugerencias">
            
            <!-- datalist: proporciona una lista de opciones predefinidas para autocompletar un input -->
            <datalist id="sugerencias">
                <option value="Formulario web">
                <option value="HTML">
                <option value="Protocolo de transferencia de hipertexto">
            </datalist>

            <button type="submit">Buscar en Wikipedia</button>
        </form>
        <!-- form para buscar ubicaciones en el servicio OpenStreetMap -->
        <form action="https://www.openstreetmap.org/search" method="get">
            <br><hr><br>
            <label for="ciudad">Buscar ciudad en el mapa:</label>
            <select id="ciudad" name="query">
                <optgroup label="Alicante">
                    <option value="Alicante">Alicante</option>
                    <option value="Elche">Elche</option>
                </optgroup>
                <optgroup label="Valencia">
                    <option value="Valencia">Valencia</option>
                    <option value="Gandia">Gandia</option>
                </optgroup>
            </select>
            <button type="submit">Buscar en el Mapa</button>
        </form>
        <!-- form para enviar la web al validador oficial W3C -->
        <form action="https://validator.w3.org/nu/" method="get">
            <br><hr><br>
            <label for="doc-url">Validar código HTML:</label>
            <!-- type="url": valida que el texto introducido sea una dirección web correcta -->
            <input type="url" id="doc-url" name="doc" value="https://mosabbrm.github.io/tarea-1.9/">
            
            <input type="checkbox" id="showsource" name="showsource" value="yes">
            <label for="showsource">Ver el código</label>
            <br><br>
            <button type="submit">Validar HTML</button>
        </form>
        <!-- Reflexión GET: El método GET envía los datos del formulario visibles en la barra de
          direcciones de la URL, lo que permite marcarlos como favoritos o compartirlos,
           aunque no es seguro para contraseñas. -->
           <!-- Reflexión POST: El método POST envía los datos ocultos en el cuerpo de la petición
             HTTP del navegador y no en la barra de direcciones. Es el método recomendado para enviar
              información sensible o privada como contraseñas, documentos o grandes volúmenes de datos. -->
</body>
</html>
