<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
    <!-- form: sirve para crear un formulario interactivo para que el 
     usuario envíe datos; action: indica la dirección web o archivo a 
     donde se envían los datos del formulario; method: especifica el 
     método HTTP con el que se envían los datos (en este caso, get) -->
        <form action="index.html" method="get">
            <!-- fieldset: sirve para agrupar elementos relacionados dentro de un formulario; 
            legend: sirve para poner un título o leyenda descriptiva al grupo del fieldset -->
            <fieldset>
                <legend>Datos personales by Mosab</legend>
                <!-- Aquí iremos añadiendo los campos más adelante -->
            </fieldset>
        </form>
</body>
</html>
